dependencies:
  espressif/ip101: "^1.1.0"
  # ESP32-P4 has no native WiFi radio; it uses the onboard ESP32-C6 co-processor over SDIO.
  espressif/esp_wifi_remote:
    version: ">=0.10,<2.0"
    rules:
      - if: "target in [esp32p4, esp32h2]"
  espressif/esp_hosted:
    version: "~2"
    rules:
      - if: "target in [esp32p4, esp32h2]"
